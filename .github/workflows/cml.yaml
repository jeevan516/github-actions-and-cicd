name: CML

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  train-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"

      - uses: iterative/setup-cml@v2.1.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Download taxi data
        run: |
          mkdir -p data
          curl -L --fail -o data/green_tripdata_2025-01.parquet \
            https://d37ci6vzurychx.cloudfront.net/trip-data/green_tripdata_2025-13.parquet

      - name: Check data matches DVC metadata
        # The DVC remote is local, so CI downloads the file instead of running
        # `dvc pull`, then checks that it is the exact version tracked in Git.
        run: |
          expected=$(awk '/md5:/ {print $3}' data/green_tripdata_2025-01.parquet.dvc)
          actual=$(md5sum data/green_tripdata_2025-01.parquet | cut -d' ' -f1)
          echo "expected=$expected actual=$actual"
          test "$expected" = "$actual"

      - name: Train model
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
        run: |
          uv run python src/train.py --cml-run

      - name: Publish CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat metrics.txt >> report.md
          cml comment create report.md
